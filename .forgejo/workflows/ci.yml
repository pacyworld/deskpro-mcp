name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        run: git clone --depth=1 --branch=${{ github.head_ref || github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git ${{ github.workspace }}

      - name: Install dependencies
        run: doas pkg install -y phpunit11-php84 php84-curl php84-tokenizer

      - name: Lint (syntax check)
        run: |
          cd ${{ github.workspace }}
          find bin classes includes libraries system tools -name '*.php' -exec php -l {} + 2>&1 | grep -v "^No syntax errors" | grep -v "^$" && exit 1 || true

      - name: PHPUnit
        run: |
          cd ${{ github.workspace }}
          phpunit --no-coverage --colors=never

      - name: Build PHAR
        run: |
          cd ${{ github.workspace }}
          php -d phar.readonly=0 bin/build-phar.php

      - name: Smoke test PHAR
        run: |
          cd ${{ github.workspace }}
          php -r "
            \$phar = new Phar('deskpro-mcp.phar');
            echo 'PHAR files: ' . count(\$phar) . PHP_EOL;
            if (count(\$phar) < 5) { echo 'ERROR: PHAR has too few files'; exit(1); }
          "

      - name: Verify MCP protocol
        run: |
          cd ${{ github.workspace }}
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' | DESKPRO_CONFIG=/dev/null php bin/deskpro-mcp 2>/dev/null || true)
          echo "$RESPONSE"
          # Server should exit with error (no config) but not crash with a PHP fatal
          php -r "echo 'PHP runtime OK' . PHP_EOL;"

      - name: curl behaviour suite and lint (vendored libraries)
        run: |
          cd ${{ github.workspace }}
          php tests/enchilada-curl/run.php --lib=libraries
          php tests/enchilada-curl/lint_curl_door.php libraries/EnchiladaCurl libraries/EnchiladaMultiHTTP libraries/EnchiladaWorkerHTTP libraries/Enchilada/Tortilla

  behaviour-windows:
    runs-on: windows-2022
    env:
      PHP_DIR: 'C:\php84'
    steps:
      - name: Checkout
        shell: powershell
        run: |
          cd "$env:GITHUB_WORKSPACE"
          Get-ChildItem | Remove-Item -Recurse -Force
          $ref = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:GITHUB_HEAD_REF } else { $env:GITHUB_SHA }
          & curl.exe -fL --ssl-no-revoke --retry 6 --retry-delay 5 -o repo.tar.gz "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/archive/$ref.tar.gz"
          if ($LASTEXITCODE -ne 0) { throw "repo tarball fetch failed (curl rc=$LASTEXITCODE)" }
          tar xf repo.tar.gz --strip-components=1
          Remove-Item repo.tar.gz

      - name: PHP (preinstalled on runner02)
        shell: powershell
        run: |
          if (-not (Test-Path "$env:PHP_DIR\php.exe")) { throw "PHP not installed at $env:PHP_DIR" }
          Add-Content -Path $env:GITHUB_PATH -Value $env:PHP_DIR

      - name: curl behaviour suite and lint (vendored libraries)
        shell: powershell
        run: |
          cd "$env:GITHUB_WORKSPACE"
          php -v
          php tests/enchilada-curl/run.php --lib=libraries
          if ($LASTEXITCODE -ne 0) { throw "behaviour suite failed" }
          php tests/enchilada-curl/lint_curl_door.php libraries/EnchiladaCurl libraries/EnchiladaMultiHTTP libraries/EnchiladaWorkerHTTP libraries/Enchilada/Tortilla
          if ($LASTEXITCODE -ne 0) { throw "curl lint failed" }
